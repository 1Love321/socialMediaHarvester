spring.application.name=socialmediacollector
spring.profiles.default=local

# Database: host, port and name come from the active profile (harvester.db.*).
# The login comes only from DB_USER_HARVEST / DB_PASSWORD_HARVEST: no defaults, never committed.
spring.r2dbc.url=r2dbc:postgresql://${harvester.db.host}:${harvester.db.port}/${harvester.db.name}
spring.r2dbc.username=${DB_USER_HARVEST}
spring.r2dbc.password=${DB_PASSWORD_HARVEST}

# Flyway migrates over JDBC at startup (the only JDBC use, ADR 0010).
spring.flyway.url=jdbc:postgresql://${harvester.db.host}:${harvester.db.port}/${harvester.db.name}
spring.flyway.user=${DB_USER_HARVEST}
spring.flyway.password=${DB_PASSWORD_HARVEST}
spring.flyway.clean-disabled=true

management.endpoints.web.exposure.include=health

# The first Admin, created only when the database has no user accounts yet.
harvester.first-admin.email=${HARVESTER_FIRST_ADMIN_EMAIL:}
harvester.first-admin.password=${HARVESTER_FIRST_ADMIN_PASSWORD:}
